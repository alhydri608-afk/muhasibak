name: muhasibak
description: تطبيق محاسبك - نظام محاسبي للمحلات الصغيرة والمتوسطة
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1

  # Firebase
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  firebase_storage: ^13.5.0

  # State Management
  provider: ^6.1.1

  # Local Database & Storage
  sqflite: ^2.4.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  path: ^1.9.1
  path_provider: ^2.1.5

  # Connectivity
  connectivity_plus: ^7.3.1

  # UI
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.1.0
  flutter_svg: ^2.3.0
  shimmer: ^3.0.0
  fl_chart: ^0.66.0
  intl: ^0.20.3

  # Images & Files
  image_picker: ^1.2.3
  file_picker: ^8.0.0
  archive: ^4.0.9

  # Sharing & Links
  share_plus: ^10.1.4
  url_launcher: ^6.3.1

  # PDF & Printing
  pdf: ^3.10.8
  printing: ^5.11.1

  # Utilities
  uuid: ^4.3.3
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/images/splash.png
    - assets/images/icon.png
    - assets/fonts/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600

# App Icon Configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#1A237E"
  adaptive_icon_foreground: "assets/images/icon.png"
  min_sdk_android: 21

# Native Splash Screen Configuration
flutter_native_splash:
  color: "#062A4D"
  image: assets/images/splash.png
  android_12:
    color: "#062A4D"
    image: assets/images/splash.png
    
